<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Fake API Demo</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            color: #1f2937;
            background: #f8fafc;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .card{
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card:hover{
            box-shadow: 0 4px 8px #0003;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: auto;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #2563eb;
            cursor: pointer;
        }

        .category { color: #64748b; font-size: 13px; }
        .price { font-size: 20px; }
        .message { color: #64748b; }

        @media (max-width: 600px) {
            .grid{
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
<body>
    <h1>Products</h1>
    <p>Product loaded from Fake Store API and rendered from parsed JSON.</p>

    <div id="products" class="grid" aria-live="polite">
        <p class="message">Loading products...</p>
    </div>

    <script src="../fakeApi/s.js"></script>
</body>
</html>
